name: Refresh economic data and deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 14 * * 1-5'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: economic-monitor-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Non-strict refresh: one flaky upstream (StatCan overnight 409/empty body,
      # transient FRED gaps) keeps prior observations, logs a clear warning, and
      # still builds. The build still fails if a provider leaves no usable series.
      - name: Refresh and build from official sources
        run: python app.py build --refresh
      - name: Verify economic calculations and refreshed observations
        run: python -m unittest discover -s tests
      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Upload public dashboard
        id: upload
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Pages unavailable
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages is not enabled (Settings → Pages → Source = GitHub Actions). Refresh and verification succeeded; upload/deploy were skipped."
    outputs:
      pages_ready: ${{ steps.pages.outcome == 'success' && steps.upload.outcome == 'success' }}
  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
