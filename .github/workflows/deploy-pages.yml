name: Refresh economic data and deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 14 * * 1-5'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: economic-monitor-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh and build from official sources
        run: python app.py build --refresh --strict
      - name: Verify economic calculations and refreshed observations
        run: python -m unittest discover -s tests
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
